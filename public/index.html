<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PulseHub, régie</title>
    <link rel="preload" href="/fonts/barlow-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/barlow-semi-condensed-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <header class="masthead">
      <h1>PulseHub</h1>
      <p id="connection" class="connection" data-state="pending">Connexion au hub…</p>
    </header>
    <main>
      <section class="summary" aria-labelledby="headline">
        <p id="headline" class="headline" aria-live="polite">En attente de trames sur le port UDP…</p>
        <p id="fleet-line" class="fleet-line"></p>
        <ul id="figures" class="figures"></ul>
      </section>
      <section class="bridge" aria-labelledby="bridge-title">
        <h2 id="bridge-title">Appareils</h2>
        <div id="strips" class="strips"></div>
        <p id="no-device" class="quiet">Chaque appareil apparaîtra ici dès sa première trame.</p>
      </section>
      <div class="split">
        <section class="cues" aria-labelledby="alerts-title">
          <h2 id="alerts-title">Alertes</h2>
          <ol id="alerts" class="cue-list"></ol>
          <p id="no-alert" class="quiet">Aucune alerte en cours</p>
        </section>
        <section class="detail" aria-labelledby="detail-title">
          <h2 id="detail-title">Détail appareil</h2>
          <p id="detail-name" class="detail-name">Aucun appareil sélectionné</p>
          <dl id="detail" class="detail-grid"></dl>
        </section>
      </div>
      <div class="split">
        <section class="reasons" aria-labelledby="reasons-title">
          <h2 id="reasons-title">Invalides par motif</h2>
          <table class="reason-table">
            <tbody id="reasons"></tbody>
          </table>
        </section>
        <section class="reasons" aria-labelledby="anomalies-title">
          <h2 id="anomalies-title">Autres anomalies de flux</h2>
          <table class="reason-table">
            <tbody id="anomalies"></tbody>
          </table>
        </section>
      </div>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
